<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zana Little Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Itim&family=Mali:wght@400;600;700&display=swap">
<style>
/* Layout: a wooden game cabinet. HUD plank, scene tabs, painted canvas (farm or ponds), tool shelf + seed/fish tray. Single bright storybook world (deliberately one theme). */
:root {
  --bg: #cfe0a8;
  --bg-2: #b2cc84;
  --ink: #2d2416;
  --wood: #b5793f;
  --wood-dk: #7a4b22;
  --panel: #fff6df;
  --sun: #f39a1e;
  --coin: #f6c63c;
  --water: #3d8fdc;
  --leaf: #4f8a2c;
  --danger: #c4442b;
  --muted: #7d6a4c;
  --display: "Itim", "Mali", "Comic Sans MS", system-ui, sans-serif;
  --body: "Mali", "Itim", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
html, body, button, canvas, .cabinet, .veil {
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
button, canvas { touch-action: manipulation; }
body {
  background: radial-gradient(circle at 20% 0%, var(--bg) 0%, var(--bg-2) 100%);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  padding-inline: 16px;
  padding-block: 14px 28px;
  min-height: 100%;
}
.cabinet { max-width: 1000px; margin: 0 auto; display: grid; gap: 10px; }

.hud {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  background: var(--wood); border: 3px solid var(--wood-dk); border-radius: 14px;
  padding: 10px 14px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15);
}
.logo { display: flex; flex-direction: column; line-height: .9; margin-right: auto; }
.logo small { font-family: var(--display); color: var(--panel); font-size: 15px; letter-spacing: .08em; }
.logo b {
  font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 38px);
  color: var(--sun); -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink);
}
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: flex; align-items: center; gap: 6px; background: var(--panel);
  border: 2px solid var(--wood-dk); border-radius: 999px; padding: 4px 12px;
  font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums;
}
.chip .coin { width: 18px; height: 18px; border-radius: 50%; background: var(--coin); border: 2px solid var(--ink); display: grid; place-items: center; font-size: 11px; line-height: 1; }
.xpbar { width: 70px; height: 9px; border-radius: 9px; background: #e8dcc0; border: 1.5px solid var(--ink); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--leaf); width: 0; transition: width .3s; }
.sunclock { width: 18px; height: 18px; }
.chip.rain { background: #d7e9fb; }

.scenes { display: flex; gap: 6px; }
.scenes button {
  flex: 0 1 auto; font-family: var(--display); font-size: 17px; color: var(--ink); cursor: pointer;
  background: var(--panel); border: 2px solid var(--wood-dk); border-bottom-width: 4px; border-radius: 12px 12px 4px 4px;
  padding: 6px 16px; display: flex; align-items: center; gap: 6px;
}
.scenes button[aria-selected="true"] { background: var(--sun); border-color: var(--ink); }
.scenes svg { width: 22px; height: 22px; }

.stage { position: relative; border: 3px solid var(--wood-dk); border-radius: 14px; overflow: hidden; background: #7fbf4a; }
canvas#farm { display: block; width: 100%; touch-action: none; cursor: grab; }
.camctl { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.camctl button { width: 40px; height: 40px; border-radius: 12px; background: var(--panel); border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink); font-family: var(--display); font-size: 22px; line-height: 1; color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
.camctl button svg { width: 24px; height: 24px; }
.camctl button[aria-pressed="true"] { background: var(--sun); }
.camctl button:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
.toast {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  background: var(--panel); border: 2px solid var(--ink); border-radius: 12px;
  padding: 6px 14px; font-family: var(--display); font-size: 16px; white-space: nowrap;
  max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 3px 0 var(--ink); transition: opacity .25s, transform .25s; pointer-events: none;
}
.toast.off { opacity: 0; transform: translate(-50%, -8px); }

.shelf { display: flex; flex-wrap: wrap; gap: 8px; background: var(--wood); border: 3px solid var(--wood-dk); border-radius: 14px; padding: 8px; }
.tool {
  flex: 1 1 74px; min-width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--panel); border: 2px solid var(--wood-dk); border-radius: 10px; padding: 6px 4px 5px;
  font-family: var(--display); font-size: 14px; color: var(--ink); cursor: pointer;
  box-shadow: 0 3px 0 var(--wood-dk); transition: transform .08s;
}
.tool svg { width: 30px; height: 30px; }
.tool kbd { font-family: var(--body); font-size: 10px; color: var(--muted); }
.tool:hover { transform: translateY(-1px); }
.tool:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dk); }
.tool[aria-pressed="true"] { background: var(--sun); border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.tool.shop { background: var(--coin); }
.tool:focus-visible, .seed:focus-visible, .btn:focus-visible, .scenes button:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }

.tray { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; }
.seed {
  flex: 0 0 auto; display: flex; align-items: center; gap: 6px; cursor: pointer;
  background: var(--panel); border: 2px solid var(--wood-dk); border-radius: 999px;
  padding: 3px 10px 3px 4px; font-family: var(--body); font-size: 13px; color: var(--ink);
}
.seed canvas { width: 32px; height: 32px; border-radius: 50%; background: #9a6a3f; }
.seed.fish canvas { background: #5fb3c9; }
.seed b { font-family: var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
.seed[aria-pressed="true"] { border-color: var(--ink); background: #ffe2a8; box-shadow: 0 0 0 2px var(--sun); }
.seed.locked { opacity: .5; }

.howto { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.howto b { color: var(--ink); font-family: var(--display); font-weight: 400; }

.veil { position: fixed; inset: 0; background: rgba(45,36,22,.45); display: grid; place-items: center; padding: 16px; z-index: 10; }
.modal {
  width: min(600px, 100%); max-height: calc(100% - 32px); overflow: auto;
  background: var(--panel); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--ink); padding: 16px;
}
.modal h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
.modal p { margin: 0 0 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.tabs button { flex: 1 1 100px; }
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; border: 2px solid #e6d6b0; border-radius: 10px; padding: 6px 8px; background: #fffbef; }
.row canvas { width: 40px; height: 40px; border-radius: 8px; background: #9a6a3f; }
.row canvas.fish { background: #5fb3c9; }
.row canvas.build { background: #7fbf4a; }
.row .meta { min-width: 0; }
.row .meta b { font-family: var(--display); font-weight: 400; font-size: 17px; display: block; }
.row .meta small { color: var(--muted); font-variant-numeric: tabular-nums; }
.row .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.row.order { background: #fff1c7; border-color: var(--coin); }
.up { color: var(--leaf); } .down { color: var(--danger); }
.quests { display: grid; gap: 6px; }
.qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qhead b { font-family: var(--display); font-weight: 400; font-size: 18px; }
.qstreak { display: flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); }
.qstreak i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--wood-dk); background: var(--panel); }
.qstreak i.on { background: var(--coin); border-color: var(--ink); }
.qrow { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scroll-snap-type: x mandatory; }
.qcard {
  flex: 1 0 210px; max-width: 320px; scroll-snap-align: start; display: grid; grid-template-columns: 44px 1fr; gap: 4px 10px; align-items: center;
  background: var(--qbg); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 10px; box-shadow: 0 3px 0 var(--ink);
}
.qcard .qic { width: 44px; height: 44px; border-radius: 12px; background: var(--qic); border: 2px solid var(--ink); display: grid; place-items: center; overflow: hidden; }
.qcard .qic svg, .qcard .qic canvas { width: 34px; height: 34px; }
.qcard .qt { font-family: var(--display); font-size: 16px; line-height: 1.2; min-width: 0; }
.qcard .qt small { display: block; font-family: var(--body); font-size: 12px; color: var(--muted); }
.qbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
.qbar span { flex: 1; height: 10px; border-radius: 9px; background: rgba(255,255,255,.7); border: 1.5px solid var(--ink); overflow: hidden; }
.qbar span i { display: block; height: 100%; background: var(--qic); transition: width .3s; }
.qbar em { font-style: normal; font-family: var(--display); font-size: 14px; font-variant-numeric: tabular-nums; }
.qcard.done { animation: qglow 1.2s ease-in-out infinite alternate; }
.qcard .btn { grid-column: 1 / -1; }
@keyframes qglow { from { box-shadow: 0 3px 0 var(--ink); } to { box-shadow: 0 3px 0 var(--ink), 0 0 0 4px var(--coin); } }
@media (prefers-reduced-motion: reduce) { .qcard.done { animation: none; box-shadow: 0 3px 0 var(--ink), 0 0 0 4px var(--coin); } }
input, select, textarea, .code { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
.code { user-select: all; -webkit-user-select: all; }
.reg { display: grid; gap: 10px; }
.reg label.f { display: grid; gap: 4px; font-size: 14px; }
.reg input:not([type="checkbox"]), .reg select {
  font-family: var(--body); font-size: 16px; color: var(--ink); background: #fff;
  border: 2px solid var(--wood-dk); border-radius: 10px; padding: 9px 12px; width: 100%;
}
.reg input:focus-visible, .reg select:focus-visible { outline: 3px solid var(--water); outline-offset: 1px; }
.reg .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.45; }
.reg .check input { width: 20px; height: 20px; flex: 0 0 auto; margin-top: 1px; accent-color: var(--sun); }
.reg .err { color: var(--danger); font-size: 14px; min-height: 1.2em; margin: 0; }
.reg .btn { font-size: 18px; padding: 10px 14px; }
.ladder { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px; }
.ladder span { flex: 1 1 90px; text-align: center; background: #fff1c7; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 4px; font-family: var(--display); font-size: 15px; line-height: 1.15; }
.ladder span small { display: block; font-family: var(--body); font-size: 11px; color: var(--muted); }
.coupon {
  border: 2px dashed var(--ink); border-radius: 14px; background: #fff1c7; padding: 12px; text-align: center; display: grid; gap: 6px;
}
.coupon .code { font-family: var(--display); font-size: 30px; letter-spacing: .08em; }
.coupon small { color: var(--muted); }
.cprow { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; border: 2px solid #e6d6b0; border-radius: 12px; padding: 8px; background: #fffbef; }
.cprow .lv { width: 52px; height: 52px; border-radius: 12px; background: var(--coin); border: 2px solid var(--ink); display: grid; place-items: center; font-family: var(--display); font-size: 15px; line-height: 1; text-align: center; }
.cprow.locked .lv { background: #e8dcc0; }
.cprow .meta { min-width: 0; }
.cprow .meta b { font-family: var(--display); font-weight: 400; font-size: 18px; display: block; }
.cprow .meta small { color: var(--muted); }
.cprow .code { font-family: var(--display); font-size: 18px; letter-spacing: .05em; }
.chip.cp { cursor: pointer; background: #fff1c7; font-size: 15px; }
.chip.cp:focus-visible { outline: 3px solid var(--water); outline-offset: 2px; }
.btn {
  font-family: var(--display); font-size: 15px; color: var(--ink); cursor: pointer;
  background: var(--coin); border: 2px solid var(--ink); border-radius: 9px; padding: 5px 10px; box-shadow: 0 2px 0 var(--ink);
}
.btn.ghost { background: #fff; }
.btn.on { background: var(--sun); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.modal footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

@media (max-width: 560px) {
  .tool { flex-basis: 46px; min-width: 46px; font-size: 12px; }
  .tool svg { width: 24px; height: 24px; }
  .tool kbd { display: none; }
  .chip { font-size: 15px; padding: 3px 9px; }
  .row { grid-template-columns: 36px 1fr; }
  .row .acts { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="cabinet">
  <header class="hud">
    <div class="logo"><small>ZANA</small><b>Little Garden</b></div>
    <div class="stats">
      <div class="chip" title="เงิน"><span class="coin">฿</span><span id="money">0</span></div>
      <div class="chip" title="เลเวล">Lv <span id="level">1</span><span class="xpbar"><i id="xp"></i></span></div>
      <div class="chip" title="วันในฟาร์ม">
        <svg class="sunclock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#fff6df" stroke="#2d2416" stroke-width="2"/><path id="clockhand" d="M10 10 L10 4" stroke="#2d2416" stroke-width="2" stroke-linecap="round"/></svg>
        วันที่ <span id="day">1</span>
      </div>
      <button class="chip cp" id="couponChip" type="button">คูปอง <span id="couponNext"></span></button>
      <div class="chip rain" id="rainChip" hidden>ฝนตก · รดน้ำให้ฟรี</div>
    </div>
  </header>

  <section class="quests" aria-label="ภารกิจประจำวัน">
    <div class="qhead"><b>ภารกิจประจำวัน</b><span class="qstreak" id="qstreak"></span></div>
    <div class="qrow" id="qrow"></div>
  </section>

  <div class="scenes" role="tablist" aria-label="พื้นที่ฟาร์ม">
    <button role="tab" id="tabField" aria-selected="true" data-scene="field"><svg viewBox="0 0 24 24"><path d="M3 20h18" stroke="#2d2416" stroke-width="2"/><path d="M8 20V12M8 14c-3 0-4-3-4-5 3 0 4 2 4 5zm0-2c0-3 2-5 5-5 0 3-2 5-5 5z" fill="#4f8a2c" stroke="#2d2416" stroke-width="1.5"/><circle cx="17" cy="16" r="3.4" fill="#e5352a" stroke="#2d2416" stroke-width="1.5"/></svg>แปลงผัก</button>
    <button role="tab" id="tabPond" aria-selected="false" data-scene="pond"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="10" ry="6" fill="#3d8fdc" stroke="#2d2416" stroke-width="1.5"/><path d="M7 14c3-3 7-3 9 0-2 3-6 3-9 0zm9 0l3-2v4z" fill="#f39a1e" stroke="#2d2416" stroke-width="1.2"/></svg>บ่อปลา</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="farm" width="960" height="600" aria-label="ฟาร์ม"></canvas>
    <div class="camctl"><button id="zoomIn" aria-label="ซูมเข้า">+</button><button id="zoomOut" aria-label="ซูมออก">−</button><button id="followBtn" aria-label="กล้องตามชาวไร่" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4" fill="#f3c9a0" stroke="#2d2416" stroke-width="1.6"/><ellipse cx="12" cy="6" rx="7" ry="2.4" fill="#e8c56a" stroke="#2d2416" stroke-width="1.4"/><path d="M6 21c0-4 3-6 6-6s6 2 6 6z" fill="#e0563a" stroke="#2d2416" stroke-width="1.6"/></svg></button></div>
    <div class="toast off" id="toast" role="status"></div>
  </div>

  <nav class="shelf" id="shelf" aria-label="เครื่องมือ"></nav>
  <div class="tray" id="tray" aria-label="เมล็ดพันธุ์และลูกปลา"></div>
  <div class="howto" id="howto"></div>
</div>

<div class="veil" id="veil" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" id="modal"></div>
</div>
<script>
(() => {
'use strict';
const DAY = 60, SAVE_KEY = 'zana-little-garden-v3';
const stage = document.getElementById('stage');
const cv = document.getElementById('farm');
let ctx = cv.getContext('2d');

/* ================= data ================= */
const CROPS = [
  { id: 'mg',         name: 'ผักบุ้ง',        lvl: 1,  cost: 4,  price: 11,  time: 18,  spots: 2 },
  { id: 'radish',     name: 'หัวไชเท้า',      lvl: 1,  cost: 5,  price: 13,  time: 22,  spots: 4 },
  { id: 'carrot',     name: 'แครอท',         lvl: 1,  cost: 7,  price: 18,  time: 28,  spots: 4 },
  { id: 'lettuce',    name: 'ผักกาดหอม',      lvl: 2,  cost: 9,  price: 24,  time: 32,  spots: 2 },
  { id: 'tomato',     name: 'มะเขือเทศ',      lvl: 2,  cost: 12, price: 32,  time: 42,  spots: 2 },
  { id: 'corn',       name: 'ข้าวโพด',        lvl: 3,  cost: 15, price: 40,  time: 50,  spots: 2 },
  { id: 'chili',      name: 'พริก',           lvl: 3,  cost: 14, price: 38,  time: 45,  spots: 2 },
  { id: 'eggplant',   name: 'มะเขือม่วง',     lvl: 4,  cost: 18, price: 48,  time: 55,  spots: 2 },
  { id: 'cucumber',   name: 'แตงกวา',        lvl: 4,  cost: 16, price: 44,  time: 50,  spots: 1 },
  { id: 'cabbage',    name: 'กะหล่ำปลี',      lvl: 5,  cost: 22, price: 60,  time: 65,  spots: 1 },
  { id: 'strawberry', name: 'สตรอว์เบอร์รี',  lvl: 5,  cost: 26, price: 72,  time: 70,  spots: 2 },
  { id: 'pumpkin',    name: 'ฟักทอง',         lvl: 6,  cost: 30, price: 85,  time: 80,  spots: 1 },
  { id: 'pineapple',  name: 'สับปะรด',        lvl: 7,  cost: 36, price: 100, time: 90,  spots: 1 },
  { id: 'grape',      name: 'องุ่น',           lvl: 8,  cost: 45, price: 125, time: 100, spots: 1 },
  { id: 'watermelon', name: 'แตงโม',          lvl: 9,  cost: 55, price: 155, time: 110, spots: 1 },
  { id: 'papaya',     name: 'มะละกอ',         lvl: 10, cost: 65, price: 185, time: 120, spots: 1 },
  { id: 'melon',      name: 'เมลอน',          lvl: 11, cost: 80, price: 230, time: 130, spots: 1 },
];
const FISH = [
  { id: 'tilapia',  name: 'ปลานิล',        lvl: 3, cost: 10, price: 34,  time: 60 },
  { id: 'catfish',  name: 'ปลาดุก',        lvl: 3, cost: 12, price: 40,  time: 70 },
  { id: 'redtil',   name: 'ปลาทับทิม',     lvl: 4, cost: 18, price: 56,  time: 80 },
  { id: 'prawn',    name: 'กุ้งก้ามกราม',  lvl: 6, cost: 30, price: 95,  time: 100 },
  { id: 'snakehead',name: 'ปลาช่อน',       lvl: 7, cost: 34, price: 110, time: 110 },
  { id: 'koi',      name: 'ปลาคาร์ป',      lvl: 9, cost: 60, price: 200, time: 140 },
];
const POND = [{ cost: 400, lvl: 3 }, { cost: 1200, lvl: 6 }, { cost: 2500, lvl: 9 }];
const POND_CAP = 6;
const UPGRADES = [
  { id: 'sprinkler', name: 'สปริงเกอร์รดน้ำอัตโนมัติ', lvl: 5, cost: 1500, note: 'รดน้ำทุกแปลงให้เองเมื่อดินเริ่มแห้ง' },
  { id: 'feeder',    name: 'เครื่องให้อาหารปลาอัตโนมัติ', lvl: 7, cost: 1800, note: 'เติมอาหารทุกบ่อให้เองเมื่ออาหารใกล้หมด' },
];
const CROP = Object.fromEntries(CROPS.map(c => [c.id, c]));
const FISHM = Object.fromEntries(FISH.map(f => [f.id, f]));
const ITEM = { ...CROP, ...FISHM };
const isFish = id => !!FISHM[id];
const xpNeed = l => 40 * l + 20 * l * l;
const landCost = n => 60 + 30 * (n - 12) + Math.floor(Math.max(0, n - 24) ** 2 * 4);

function newOrder(st) {
  const pool = [
    ...CROPS.filter(c => c.lvl <= st.level),
    ...(st.ponds.some(p => p.dug) ? FISH.filter(f => f.lvl <= st.level) : []),

  const qty = isFish(it.id) ? 2 + Math.floor(Math.random() * 3) : 3 + Math.floor(Math.random() * 6);
  return { id: it.id, qty, reward: Math.round(it.price * qty * 1.5), xp: Math.round(it.price * qty / 3), who: BUYERS[Math.floor(Math.random() * BUYERS.length)], done: false };

function update(dt) {

  let needSpray = false;
  for (let i = 0; i < S.unlocked; i++) {
    const p = S.plots[i];
    if (S.rain > 0 && (p.s === 'soil' || p.s === 'crop')) { p.w = 100; p.dry = 0; }
    if (p.w > 0) p.w = Math.max(0, p.w - dt * 2.4);
    if (S.up.sprinkler && p.s === 'crop' && p.p < 1 && p.w < 12) needSpray = true;
    if (p.s !== 'crop') continue;
    const c = CROP[p.c];
    if (p.p < 1) {
      if (p.w > 0) { p.p = Math.min(1, p.p + dt / c.time * (p.f ? 1.6 : 1)); p.dry = 0; }
      else { p.dry = (p.dry || 0) + dt; if (p.dry > 25) p.s = 'dead'; }
    } else { p.ripe = (p.ripe || 0) + dt; if (p.ripe > 120) p.s = 'dead'; }
  }
  if (needSpray) { for (let i = 0; i < S.unlocked; i++) { const p = S.plots[i]; if (p.s === 'soil' || p.s === 'crop') { p.w = 100; p.dry = 0; } } sprayT = 1.8; }
  if (sprayT > 0) sprayT -= dt;
  S.ponds.forEach((pd, i) => {
    if (!pd.dug) return;
    if (pd.food > 0) pd.food = Math.max(0, pd.food - dt * 2);
    if (S.up.feeder && pd.fish.length && pd.food < 15) pd.food = 100;
    for (const f of pd.fish) if (f.g < 1 && pd.food > 0) f.g = Math.min(1, f.g + dt / FISHM[f.t].time);
    swim(i, pd, dt);
  });
  updateFarmer(dt);
  updateAnimals(dt);
}

function renderShelf() {
  const shelf = $('shelf'); shelf.innerHTML = '';
  SCENE_TOOLS[S.mode].forEach((id, k) => {
    const b = document.createElement('button'); b.className = 'tool'; b.dataset.tool = id;
    b.setAttribute('aria-pressed', String(curTool() === id));
    b.innerHTML = '<svg viewBox="0 0 32 32">' + TOOL_SVG[id] + '</svg>' + TOOL_NAME[id] + '<kbd>' + (k + 1) + '</kbd>';
    b.addEventListener('click', () => setTool(id));
    shelf.appendChild(b);
  });
  const m = document.createElement('button'); m.className = 'tool shop';
  m.innerHTML = '<svg viewBox="0 0 32 32"><path d="M4 14 L16 5 L28 14 Z" fill="#d9412b" stroke="#2d2416" stroke-width="2" stroke-linejoin="round"/><rect x="7" y="14" width="18" height="13" fill="#fff6df" stroke="#2d2416" stroke-width="2"/><rect x="13" y="18" width="6" height="9" fill="#b5793f" stroke="#2d2416" stroke-width="2"/></svg>ตลาด<kbd>M</kbd>';
  m.addEventListener('click', () => openMarket());
  shelf.appendChild(m);
  $('howto').innerHTML = HOWTO[S.mode];
}
function setTool(id) {
  if (S.mode === 'field') S.toolF = id; else S.toolP = id;
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === id)));
  renderTray();
}
function setMode(m, pan) {
  S.mode = m;
  $('tabField').setAttribute('aria-selected', String(m === 'field'));
  $('tabPond').setAttribute('aria-selected', String(m === 'pond'));
  hover = -1; renderShelf(); renderTray();
  if (pan !== false) { if (m === 'field') lookAt(FIELD.x + FIELD.w / 2, FIELD.y + 180); else lookAt(PONDS[0].cx - 40, (PONDS[0].cy + PONDS[1].cy) / 2); }
  if (m === 'pond' && !S.ponds.some(p => p.dug)) toast(S.level < POND[0].lvl ? 'ขุดบ่อปลาได้เมื่อถึงเลเวล ' + POND[0].lvl : 'แตะป้าย "ขุดสระ" เพื่อสร้างบ่อแรก');
}
function paintInto(el, src) { el.width = src.width; el.height = src.height; el.getContext('2d').drawImage(src, 0, 0); }
function renderTray() {
  const tray = $('tray'); tray.innerHTML = '';
  const list = S.mode === 'field' ? CROPS : FISH;
  for (const c of list) {
    const b = document.createElement('button'), locked = c.lvl > S.level, fish = isFish(c.id);
    b.className = 'seed' + (locked ? ' locked' : '') + (fish ? ' fish' : '');
    const sel = fish ? (S.toolP === 'stock' && S.fsel === c.id) : (S.toolF === 'seed' && S.seed === c.id);
    b.setAttribute('aria-pressed', String(sel));
    const cv2 = document.createElement('canvas'); paintInto(cv2, itemIcon(c.id, 32)); b.appendChild(cv2);
    const s = document.createElement('span');
    const have = fish ? (S.fry[c.id] || 0) : (S.seeds[c.id] || 0);
    s.innerHTML = locked ? c.name + ' · Lv ' + c.lvl : c.name + ' <b>×' + have + '</b>';
    b.appendChild(s);
    b.addEventListener('click', () => {
      if (locked) { toast(c.name + ' ปลดล็อกที่เลเวล ' + c.lvl); return; }
      if (fish) { S.fsel = c.id; setTool('stock'); } else { S.seed = c.id; setTool('seed'); }
      if (!have) toast((fish ? 'ลูกปลา' : 'เมล็ด') + c.name + 'หมด · กด "ตลาด" เพื่อซื้อ');
    });
    tray.appendChild(b);
  }
}
let hudCache = '';
function hud() {
  const key = [S.money, S.level, S.xp, S.day].join('|');
  if (key !== hudCache) {
    hudCache = key;
    $('money').textContent = S.money.toLocaleString('th-TH');
    $('level').textContent = S.level;
    const prev = S.level > 1 ? xpNeed(S.level - 1) : 0;
    $('xp').style.width = Math.min(100, (S.xp - prev) / (xpNeed(S.level) - prev) * 100) + '%';
    $('day').textContent = S.day;
  }
  $('rainChip').hidden = !(S.rain > 0);
  const a = S.clock / DAY * Math.PI * 2;
  $('clockhand').setAttribute('d', 'M10 10 L' + (10 + Math.sin(a) * 6).toFixed(1) + ' ' + (10 - Math.cos(a) * 6).toFixed(1));
}

let modalKind = '', marketTab = 'seed';

$('veil').addEventListener('click', e => { if (e.target.id === 'veil') closeModal(); });
function openMarket(tab) { marketTab = tab || (S.mode === 'pond' ? 'fry' : 'seed'); renderMarket(); }
function priceToday(id) { return Math.round(ITEM[id].price * S.market[id]); }
function renderMarket() {
  let rows = '';

  if (marketTab === 'seed' || marketTab === 'fry') {
    const list = marketTab === 'seed' ? CROPS : FISH, inv = marketTab === 'seed' ? S.seeds : S.fry, word = marketTab === 'seed' ? 'เมล็ด' : 'ลูกปลา';

    if (marketTab === 'fry' && !S.ponds.some(p => p.dug)) rows = `<p>ยังไม่มีบ่อปลา · ขุดบ่อแรกได้ที่แท็บ "ขยายฟาร์ม" (ต้องการ Lv ${POND[0].lvl})</p>` + rows;
  } else if (marketTab === 'sell') {
    const o = S.order;
    if (o) {
      const have = S.barn[o.id] || 0;
      rows += `<div class="row order"><canvas data-icon="${o.id}" class="${isFish(o.id) ? 'fish' : ''}"></canvas><div class="meta"><b>ออเดอร์: ${o.who}</b><small>${o.done ? 'ส่งแล้ว · พรุ่งนี้มีออเดอร์ใหม่' : `ต้องการ${ITEM[o.id].name} ×${o.qty} (มี ${have}) · รางวัล ฿${o.reward} + ${o.xp} XP`}</small></div>
        <div class="acts">${o.done ? '' : `<button class="btn" data-act="order" ${have < o.qty ? 'disabled' : ''}>ส่งของ</button>`}</div></div>`;
    }
    let any = false;
    for (const id of Object.keys(ITEM)) {
      const n = S.barn[id] || 0; if (!n) continue; any = true;
      const m = S.market[id], price = priceToday(id), prev = S.prevMarket ? S.prevMarket[id] : 1;
      const trend = m > prev + 0.02 ? '<span class="up">▲</span>' : m < prev - 0.02 ? '<span class="down">▼</span>' : '';
      rows += `<div class="row"><canvas data-icon="${id}" class="${isFish(id) ? 'fish' : ''}"></canvas><div class="meta"><b>${ITEM[id].name} ×${n}</b><small>วันนี้ ฿${price} ${trend} · ราคาปกติ ฿${ITEM[id].price}</small></div>
        <div class="acts"><button class="btn ghost" data-sell="${id}" data-n="1">ขาย 1</button><button class="btn" data-sell="${id}" data-n="${n}">ขายหมด ฿${(price * n).toLocaleString()}</button></div></div>`;
    }
    if (!any) rows += '<p>ยุ้งฉางยังว่าง · เก็บผักหรือช้อนปลาที่โตแล้ว แล้วกลับมาขายที่นี่</p>';
    else rows += '<div style="display:flex;justify-content:flex-end"><button class="btn" data-act="sellall">ขายทั้งหมดในยุ้งฉาง</button></div>';
  } else {
    if (S.unlocked < MAX_PLOTS) {
      const c1 = landCost(S.unlocked); let c4 = 0; for (let k = 0; k < Math.min(4, MAX_PLOTS - S.unlocked); k++) c4 += landCost(S.unlocked + k);
      rows += `<div class="row"><canvas data-build="land" class="build"></canvas><div class="meta"><b>ขยายแปลงปลูก</b><small>มี ${S.unlocked}/${MAX_PLOTS} แปลง · แปลงถัดไป ฿${c1.toLocaleString()}</small></div>
        <div class="acts"><button class="btn" data-act="land1" ${S.money < c1 ? 'disabled' : ''}>+1 แปลง</button><button class="btn" data-act="land4" ${S.money < c4 ? 'disabled' : ''}>+4 แปลง ฿${c4.toLocaleString()}</button></div></div>`;
    } else rows += `<div class="row"><canvas data-build="land" class="build"></canvas><div class="meta"><b>แปลงปลูกเต็มพื้นที่แล้ว</b><small>${MAX_PLOTS} แปลง</small></div><div class="acts"></div></div>`;

        <div class="acts">${dug ? '' : `<button class="btn" data-act="pond" data-i="${i}" ${lock || S.money < p.cost ? 'disabled' : ''}>ขุดสระ ฿${p.cost.toLocaleString()}</button>`}</div></div>`;
    });
    UPGRADES.forEach(u => {
      const has = S.up[u.id], lock = S.level < u.lvl;
      rows += `<div class="row"><canvas data-build="${u.id}" class="build"></canvas><div class="meta"><b>${u.name}</b><small>${has ? 'ติดตั้งแล้ว' : lock ? 'ต้องการ Lv ' + u.lvl + ' · ' + u.note : u.note}</small></div>
        <div class="acts">${has ? '' : `<button class="btn" data-act="up" data-id="${u.id}" ${lock || S.money < u.cost ? 'disabled' : ''}>ซื้อ ฿${u.cost.toLocaleString()}</button>`}</div></div>`;
    });
  }
  const tabs = [['seed', 'เมล็ดพันธุ์'], ['fry', 'ลูกปลา'], ['sell', 'ขาย / ออเดอร์'], ['build', 'ขยายฟาร์ม']];
  openModal('market', `<h2 id="mTitle">ตลาดหมู่บ้าน</h2>
    <p>เงินของคุณ <b>${money}</b> · ราคาขายเปลี่ยนทุกเช้า รอขายวันที่ราคาขึ้นได้กำไรมากกว่า</p>
    <div class="tabs">${tabs.map(([k, n]) => `<button class="btn ${marketTab === k ? 'on' : 'ghost'}" data-tab="${k}">${n}</button>`).join('')}</div>

    <footer><button class="btn ghost" data-act="reset">เริ่มฟาร์มใหม่</button><button class="btn" data-act="close">กลับไปที่ฟาร์ม</button></footer>`);
}
function buildIcon(kind, size) {
  const [c, k] = mk(size, size);
  withCtx(k, () => {
    if (kind === 'land') { ctx.drawImage(tiles.soil, 4, 6, size - 8, size - 12); ctx.save(); ctx.translate(size / 2, size * 0.78); ctx.scale(size / 70, size / 70); DRAW.lettuce(0.8); ctx.restore(); }
    else if (kind === 'pond' || kind === 'feeder') { const g = ctx.createRadialGradient(size * 0.4, size * 0.4, 2, size / 2, size / 2, size / 2); g.addColorStop(0, '#7fd0e0'); g.addColorStop(1, '#2a7a9a'); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(size / 2, size / 2, size * 0.42, size * 0.3, 0, 0, 7); ctx.fill(); ctx.save(); ctx.translate(size / 2, size / 2); drawFish(kind === 'feeder' ? 'koi' : 'tilapia', size / 40, 0.2, 5); ctx.restore(); }
    else { ctx.fillStyle = '#9aa6ad'; ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; rr(size / 2 - 4, size * 0.45, 8, size * 0.45, 2); ctx.fill(); ctx.stroke(); ctx.strokeStyle = '#3d8fdc'; ctx.lineWidth = 1.5; for (let q = -2; q <= 2; q++) { ctx.beginPath(); ctx.moveTo(size / 2, size * 0.45); ctx.quadraticCurveTo(size / 2 + q * 5, size * 0.1, size / 2 + q * 9, size * 0.4); ctx.stroke(); } }
  });
  return c;
}
function paintIcons() {
  $('modal').querySelectorAll('canvas[data-icon]').forEach(el => paintInto(el, itemIcon(el.dataset.icon, 40)));
  $('modal').querySelectorAll('canvas[data-build]').forEach(el => paintInto(el, buildIcon(el.dataset.build, 40)));
}
function askLand() {
  if (S.unlocked >= MAX_PLOTS) return;
  const cost = landCost(S.unlocked);
  openModal('land', `<h2 id="mTitle">ขยายแปลงปลูก</h2><p>ถางป่าเปิดแปลงใหม่ 1 แปลงในราคา <b>฿${cost.toLocaleString()}</b> (คุณมี ฿${S.money.toLocaleString('th-TH')})</p>
    <footer><button class="btn ghost" data-act="close">ยังก่อน</button><button class="btn" data-act="land1" ${S.money < cost ? 'disabled' : ''}>ซื้อที่ดิน ฿${cost.toLocaleString()}</button></footer>`);
}
function askPond(i) {
  const p = POND[i], lock = S.level < p.lvl;
  openModal('pond', `<h2 id="mTitle">ขุดบ่อปลา ${i + 1}</h2><p>${lock ? 'ต้องถึงเลเวล ' + p.lvl + ' ก่อนจึงจะขุดบ่อนี้ได้' : 'ขุดสระเลี้ยงปลาได้ ' + POND_CAP + ' ตัว ราคา <b>฿' + p.cost.toLocaleString() + '</b> (คุณมี ฿' + S.money.toLocaleString('th-TH') + ')'}</p>
    <footer><button class="btn ghost" data-act="close">ยังก่อน</button><button class="btn" data-act="pond" data-i="${i}" ${lock || S.money < p.cost ? 'disabled' : ''}>ขุดสระ ฿${p.cost.toLocaleString()}</button></footer>`);

function askReset() {
  openModal('reset', `<h2 id="mTitle">เริ่มฟาร์มใหม่?</h2><p>เงิน เลเวล เมล็ด ผัก บ่อปลา และปลาทั้งหมดจะถูกล้าง เริ่มต้นใหม่ที่วันที่ 1</p>
    <footer><button class="btn ghost" data-act="close">ไม่ล้าง</button><button class="btn" data-act="doreset">ล้างแล้วเริ่มใหม่</button></footer>`);

function buyLand(n) {
  let bought = 0;
  for (let k = 0; k < n && S.unlocked < MAX_PLOTS; k++) { const c = landCost(S.unlocked); if (S.money < c) break; S.money -= c; S.unlocked++; bought++; }
  if (bought) toast('ได้แปลงใหม่ ' + bought + ' แปลง · ใช้จอบไถได้เลย');
  return bought;
}
$('modal').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.tab) { marketTab = b.dataset.tab; renderMarket(); return; }
  if (b.dataset.buy) {
    const c = ITEM[b.dataset.buy], n = +b.dataset.n, inv = isFish(c.id) ? S.fry : S.seeds;
    if (S.money >= c.cost * n) { S.money -= c.cost * n; inv[c.id] = (inv[c.id] || 0) + n; toast('ซื้อ' + (isFish(c.id) ? 'ลูกปลา' : 'เมล็ด') + c.name + ' ' + n + ' ' + (isFish(c.id) ? 'ตัว' : 'เมล็ด')); }
    renderMarket(); renderTray(); hud(); return;
  }
  if (b.dataset.sell) {
    const id = b.dataset.sell, n = Math.min(+b.dataset.n, S.barn[id] || 0), got = priceToday(id) * n;
    S.barn[id] -= n; S.money += got; questEvent('earn', null, got); toast('ขาย' + ITEM[id].name + ' ' + n + ' ได้ ฿' + got.toLocaleString());
    renderMarket(); hud(); save(); return;
  }
  const act = b.dataset.act;
  if (act === 'close') closeModal();
  if (act === 'sellall') { let got = 0; for (const id of Object.keys(S.barn)) { got += priceToday(id) * S.barn[id]; S.barn[id] = 0; } S.money += got; questEvent('earn', null, got); toast('ขายทั้งหมดได้ ฿' + got.toLocaleString()); renderMarket(); hud(); save(); }

  if (act === 'reset') askReset();
  if (act === 'doreset') { S = newState(); hudCache = ''; resetFarmer(); ensureQuests(); renderQuests(); buildBackgrounds(); setMode('field'); hud(); save(); closeModal(); toast('ฟาร์มใหม่พร้อมแล้ว · เริ่มไถดินกันเลย'); }

/* ================= daily quests ================= */
const QTYPES = {
  till:      { c: '#f7e2b8', i: '#d9a35a', tool: 'hoe',    t: n => 'ไถดิน ' + n + ' แปลง' },
  plant:     { c: '#dff1c6', i: '#7cbf4a', tool: 'seed',   t: (n, it) => 'ปลูก' + it.name + ' ' + n + ' แปลง' },
  water:     { c: '#d6ebfb', i: '#5aa7e6', tool: 'water',  t: n => 'รดน้ำ ' + n + ' ครั้ง' },
  fert:      { c: '#f3ecc4', i: '#c9b257', tool: 'fert',   t: n => 'ใส่ปุ๋ย ' + n + ' แปลง' },
  harvest:   { c: '#fde0d2', i: '#ee8a5f', tool: 'hand',   t: (n, it) => 'เก็บ' + it.name + ' ' + n + ' ผล' },
  harvestAny:{ c: '#fbe3ef', i: '#e77fa8', tool: 'hand',   t: n => 'เก็บผลผลิตอะไรก็ได้ ' + n + ' ชิ้น' },
  earn:      { c: '#fff1bf', i: '#f2c23a', tool: null,     t: n => 'ขายของให้ได้ ฿' + n.toLocaleString() },
  order:     { c: '#efe2fb', i: '#a986d9', tool: null,     t: () => 'ส่งออเดอร์ให้ลูกค้า 1 ครั้ง' },
  stock:     { c: '#d4f2f2', i: '#4fbcbc', tool: 'stock',  t: n => 'ปล่อยลูกปลา ' + n + ' ตัว' },
  feed:      { c: '#e5f0d4', i: '#93b85a', tool: 'feed',   t: n => 'ให้อาหารปลา ' + n + ' ครั้ง' },
  catch:     { c: '#d9e6fb', i: '#5c87d6', tool: 'net',    t: (n, it) => 'จับ' + it.name + ' ' + n + ' ตัว' },
};
const QUEST_DAILY = 5;
const pick = a => a[Math.floor(Math.random() * a.length)];
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function newQuest(avoid) {
  const crops = CROPS.filter(c => c.lvl <= S.level), pond = S.ponds.some(p => p.dug), fish = FISH.filter(f => f.lvl <= S.level);
  const pool = ['till', 'plant', 'plant', 'water', 'harvest', 'harvest', 'harvestAny', 'earn'];
  if (S.level >= 2) pool.push('fert', 'order');
  if (pond) pool.push('stock', 'feed', 'catch', 'catch');
  let type;
  for (let k = 0; k < 8; k++) { type = pick(pool); if (!avoid.includes(type)) break; }
  const q = { type, id: null, n: 1, have: 0 };
  let value;
  switch (type) {
    case 'till': q.n = rint(3, 8); value = q.n * 6; break;
    case 'plant': { const c = pick(crops.slice(-4)); q.id = c.id; q.n = rint(2, 5); value = q.n * (c.cost + 6); break; }
    case 'water': q.n = rint(5, 12); value = q.n * 4; break;
    case 'fert': q.n = rint(2, 4); value = q.n * 9; break;
    case 'harvest': { const c = pick(crops.slice(-4)); q.id = c.id; q.n = rint(2, 5); value = q.n * c.price * 0.7; break; }
    case 'harvestAny': q.n = rint(5, 12); value = q.n * 10; break;
    case 'earn': q.n = Math.round(rint(100, 120 + S.level * 120) / 10) * 10; value = q.n * 0.25; break;
    case 'order': value = 40 + S.level * 15; break;
    case 'stock': q.n = rint(2, 4); value = q.n * 12; break;
    case 'feed': q.n = rint(2, 4); value = q.n * 8; break;
    case 'catch': { const f = pick(fish.slice(-3)); q.id = f.id; q.n = rint(1, 3); value = q.n * f.price * 0.7; break; }
  }
  q.reward = Math.max(15, Math.round(value / 5) * 5);
  q.xp = Math.max(5, Math.round(q.reward / 4));
  if (Math.random() < 0.3) { const c = pick(crops.slice(-3)); q.seeds = { id: c.id, n: rint(2, 4) }; }
  return q;
}
function ensureQuests() {
  if (!Array.isArray(S.quests)) S.quests = [];
  if (S.qDone == null) { S.qDone = 0; S.qBonus = false; }
  while (S.quests.length < 3) S.quests.push(newQuest(S.quests.map(q => q.type)));
}
function questEvent(type, id, n) {
  if (!S.quests) return;
  n = n || 1;
  let changed = false;
  for (const q of S.quests) {
    if (q.have >= q.n) continue;
    const hit = (q.type === type && (!q.id || q.id === id)) || (q.type === 'harvestAny' && (type === 'harvest' || type === 'catch'));
    if (!hit) continue;
    q.have = Math.min(q.n, q.have + n); changed = true;
    if (q.have >= q.n) toast('ภารกิจสำเร็จ! ' + QTYPES[q.type].t(q.n, ITEM[q.id] || {}) + ' · กดรับรางวัลได้เลย');
  }
  if (changed) renderQuests();
}
function claimQuest(k) {
  const q = S.quests[k]; if (!q || q.have < q.n) return;
  S.money += q.reward;
  gainXp(q.xp, F.x, F.y - 70);
  float(F.x, F.y - 90, '+฿' + q.reward, '#b07a10'); burst(F.x, F.y - 60, '#f6c63c', 18);
  let msg = 'รับ ฿' + q.reward + ' + ' + q.xp + ' XP';
  if (q.seeds) { S.seeds[q.seeds.id] = (S.seeds[q.seeds.id] || 0) + q.seeds.n; msg += ' + เมล็ด' + CROP[q.seeds.id].name + ' ×' + q.seeds.n; renderTray(); }
  S.qDone++;
  if (S.qDone >= QUEST_DAILY && !S.qBonus) {
    S.qBonus = true;
    const bonus = 80 + S.level * 60, c = pick(CROPS.filter(x => x.lvl <= S.level).slice(-3));
    S.money += bonus; S.seeds[c.id] = (S.seeds[c.id] || 0) + 5; renderTray();
    msg = 'ครบ ' + QUEST_DAILY + ' ภารกิจวันนี้! โบนัส ฿' + bonus + ' + เมล็ด' + c.name + ' ×5';
    burst(F.x, F.y - 60, '#ef8fb0', 24);
  }
  toast(msg);
  S.quests.splice(k, 1, newQuest(S.quests.map(x => x.type)));
  renderQuests(); hud(); save();
}
function renderQuests() {
  if (!S || !S.quests) return;
  const row = $('qrow'); row.innerHTML = '';
  S.quests.forEach((q, k) => {
    const T = QTYPES[q.type], it = ITEM[q.id], done = q.have >= q.n;
    const card = document.createElement('div');
    card.className = 'qcard' + (done ? ' done' : '');
    card.style.setProperty('--qbg', T.c); card.style.setProperty('--qic', T.i);
    const ic = document.createElement('div'); ic.className = 'qic';
    if (it) { const c2 = document.createElement('canvas'); paintInto(c2, itemIcon(q.id, 34)); ic.appendChild(c2); }
    else if (T.tool) ic.innerHTML = '<svg viewBox="0 0 32 32">' + TOOL_SVG[T.tool] + '</svg>';
    else ic.innerHTML = q.type === 'earn' ? '<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="#f6c63c" stroke="#2d2416" stroke-width="2"/><text x="16" y="21" text-anchor="middle" font-size="13" font-family="Itim, sans-serif" fill="#2d2416">฿</text></svg>' : '<svg viewBox="0 0 32 32"><path d="M6 6 H26 V27 H6 Z" fill="#fff6df" stroke="#2d2416" stroke-width="2"/><path d="M10 12 H22 M10 17 H22 M10 22 H17" stroke="#2d2416" stroke-width="2"/></svg>';
    card.appendChild(ic);
    const tx = document.createElement('div'); tx.className = 'qt';
    tx.innerHTML = T.t(q.n, it || {}) + '<small>รางวัล ฿' + q.reward + ' · ' + q.xp + ' XP' + (q.seeds ? ' · เมล็ด' + CROP[q.seeds.id].name + ' ×' + q.seeds.n : '') + '</small>';
    card.appendChild(tx);
    if (done) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = 'รับรางวัล ฿' + q.reward; b.addEventListener('click', () => claimQuest(k)); card.appendChild(b); }
    else { const bar = document.createElement('div'); bar.className = 'qbar'; const shown = q.type === 'earn' ? '฿' + q.have.toLocaleString() + '/' + q.n.toLocaleString() : q.have + '/' + q.n; bar.innerHTML = '<span><i style="width:' + (q.have / q.n * 100) + '%"></i></span><em>' + shown + '</em>'; card.appendChild(bar); }
    row.appendChild(card);
  });
  $('qstreak').innerHTML = Array.from({ length: QUEST_DAILY }, (_, k) => '<i class="' + (k < S.qDone ? 'on' : '') + '"></i>').join('') + (S.qBonus ? ' ได้โบนัสวันนี้แล้ว' : ' ครบ ' + QUEST_DAILY + ' รับโบนัส');
}

// Players register (name, phone, LINE) before playing; reaching milestone levels earns a

const SHOP_NAME = 'ZANA', API = 'https://gxycxjksrzjzxzgbblup.supabase.co/functions/v1/garden', PKEY = 'zana-garden-player';
const DEFAULT_MILESTONES = [{ level: 3, label: 'ส่วนลด 5%' }, { level: 5, label: 'ส่วนลด 10%' }, { level: 8, label: 'ส่วนลด 15%' }];
let PL = { token: null, name: '', milestones: [], demo: false };
try { const s = JSON.parse(localStorage.getItem(PKEY)); if (s && s.token) PL = { ...PL, ...s }; } catch (_) {}
const qp = k => { try { return new URLSearchParams(location.search).get(k) || ''; } catch (_) { return ''; } };
const codeParam = qp('code').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 20);
const claiming = {}, waitNoted = {};
function savePlayer() { try { localStorage.setItem(PKEY, JSON.stringify({ token: PL.token, name: PL.name, milestones: PL.milestones })); } catch (_) {} }

const ms = () => (PL.milestones.length ? PL.milestones : DEFAULT_MILESTONES);
async function api(action, data, keepalive) {
  let res;
  try { res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action, ...data }), keepalive: !!keepalive }); }
  catch (_) { const e = new Error('เชื่อมต่ออินเทอร์เน็ตไม่ได้ ลองใหม่อีกครั้ง'); e.offline = true; throw e; }
  let body = null; try { body = await res.json(); } catch (_) {}
  if (!res.ok || !body) { const e = new Error((body && body.error) || 'ระบบเกมไม่ตอบสนอง ลองใหม่อีกครั้ง'); e.status = res.status; e.body = body; e.offline = !body; throw e; }
  return body;
}
const progress = () => ({ level: S.level, harvested: S.harvested, playSeconds: Math.round(S.playSec || 0) });
function applySnapshot(d) { if (d.milestones) PL.milestones = d.milestones; if (d.player) PL.name = d.player.name; savePlayer(); renderCouponChip(); }
function lostSession() { PL.token = null; savePlayer(); openRegister('เซสชันหมดอายุ กรุณายืนยันเบอร์โทรอีกครั้ง ความคืบหน้าและคูปองยังอยู่ครบ'); }
async function syncPlayer(keepalive) {
  if (!PL.token) return;
  try { applySnapshot(await api('sync', { token: PL.token, ...progress() }, keepalive)); checkMilestones(); }
  catch (e) { if (e.status === 401) lostSession(); }
}
function onLevelUp() { if (PL.token) syncPlayer(); else if (PL.demo) { const m = ms().find(x => x.level === S.level); if (m) toast('ถึงเลเวล ' + m.level + ' แล้ว · ลงทะเบียนเพื่อรับ' + m.label); } }
function checkMilestones() {
  if (!PL.token) return;
  for (const m of PL.milestones) {
    if (m.reward || S.level < m.level || claiming[m.level]) continue;
    const wait = Date.parse(m.unlockAt) - Date.now();
    if (wait > 0) {
      if (!waitNoted[m.level]) { waitNoted[m.level] = true; toast('ถึงเลเวล ' + m.level + ' แล้ว! ' + m.label + ' ปลดล็อกในอีก ' + Math.ceil(wait / 60000) + ' นาที เล่นต่อได้เลย'); }
      continue;
    }
    claimMilestone(m.level);
  }
}
async function claimMilestone(level) {
  claiming[level] = true;
  try {
    const d = await api('claim', { token: PL.token, milestone: level, ...progress() });
    applySnapshot(d);
    const m = PL.milestones.find(x => x.level === level);
    if (m && m.reward) showCouponWin(m);

}
function openCoupons() {
  const rows = ms().map(m => {
    const r = m.reward, reached = S.level >= m.level;
    let right = '', sub;
    if (r) { sub = r.redeemedAt ? 'ใช้แล้วเมื่อ ' + fmtTH(r.redeemedAt) : 'ใช้ได้ถึง ' + fmtTH(r.expiresAt); right = `<button class="btn ghost" data-act="copycode" data-code="${esc(r.code)}">คัดลอก</button>`; }
    else if (!PL.token) sub = 'ลงทะเบียนเพื่อรับคูปองนี้';
    else if (reached && m.unlockAt && Date.parse(m.unlockAt) > Date.now()) sub = 'ปลดล็อกในอีก ' + Math.ceil((Date.parse(m.unlockAt) - Date.now()) / 60000) + ' นาที';
    else sub = reached ? 'กำลังออกคูปอง…' : 'อีก ' + (m.level - S.level) + ' เลเวล';
    return `<div class="cprow ${r ? '' : 'locked'}"><div class="lv">Lv<br>${m.level}</div><div class="meta"><b>${esc(m.label)}</b>${r ? '<span class="code">' + esc(r.code) + '</span><br>' : ''}<small>${sub}</small></div>${right}</div>`;
  }).join('');
  openModal('coupons', `<h2 id="mTitle">คูปองของฉัน</h2>
    <p>${PL.token ? 'ผู้เล่น: <b>' + esc(PL.name) + '</b> · เลเวล ' + S.level : 'โหมดทดลอง · ยังไม่ได้ลงทะเบียน'}</p>
    <div class="rows">${rows}</div>
    <p style="margin-top:10px;font-size:13px;color:var(--muted)">ส่งโค้ดให้แอดมินทางแชทตอนสั่งซื้อ หรือแสดงที่หน้าร้าน คูปองแต่ละใบใช้ได้ 1 ครั้ง</p>
    <footer>${PL.token ? '<button class="btn ghost" data-act="relogin">ไม่ใช่ฉัน / เปลี่ยนเบอร์</button>' : '<button class="btn" data-act="register">ลงทะเบียนรับคูปอง</button>'}<button class="btn" data-act="close">กลับไปที่ฟาร์ม</button></footer>`);
  if (PL.token) syncPlayer();
}
$('couponChip').addEventListener('click', openCoupons);
$('modal').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'demo') { PL.demo = true; closeModal(true); toast('โหมดทดลอง · กดปุ่ม "คูปอง" ด้านบนเพื่อลงทะเบียนเมื่อพร้อม'); }
  if (act === 'register') openRegister();
  if (act === 'relogin') { PL.token = null; PL.milestones = []; savePlayer(); renderCouponChip(); openRegister(); }
  if (act === 'copycode') {
    const c = b.dataset.code;
    try { await navigator.clipboard.writeText(c); b.textContent = 'คัดลอกแล้ว'; }
    catch (_) { const el = b.parentElement.querySelector('.code'); if (el) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } b.textContent = 'กดค้างที่โค้ดเพื่อคัดลอก'; }
  }
});
setInterval(() => { if (PL.token && !document.hidden) syncPlayer(); }, 60000);
setInterval(checkMilestones, 20000);
document.addEventListener('visibilitychange', () => { if (document.hidden && PL.token) syncPlayer(true); });

/* ================= sizing / save / loop ================= */
function resize() {
  cssW = stage.clientWidth;
  const portrait = cssW < 620;
  cssH = Math.round(portrait ? Math.max(360, Math.min(window.innerHeight * 0.62, cssW * 1.35)) : Math.min(cssW * 0.6, window.innerHeight * 0.78));
  cv.style.height = cssH + 'px';
  dpr = Math.min(3, window.devicePixelRatio || 1); R = dpr;
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  baseZ = portrait ? cssW / 560 : cssW / 1000;
  cam.z = baseZ * zoomMul;
  const nb = Math.max(1, Math.min(1.75, dpr * baseZ * 1.3));
  if (!bg || Math.abs(nb - BGS) > 0.2) { BGS = nb; buildBackgrounds(); }
  clampCam();
}
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
function save() { try { S.farmer = { x: F.x, y: F.y }; localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
function load() {
  for (const key of [SAVE_KEY, 'zana-little-garden-v2']) {
    try {
      const s = JSON.parse(localStorage.getItem(key));
      if (s && (s.v === 2 || s.v === 3)) { s.v = 3; if (!s.mode) s.mode = s.scene || 'field'; delete s.scene; return s; }
    } catch (_) {}
  }
  return null;
}
setInterval(() => S && save(), 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });

let prev = 0;
function frame(now) {
  const dt = Math.min(0.25, (now - prev) / 1000 || 0); prev = now; t += dt;
  if ($('veil').hidden || modalKind === 'market') update(dt);
  updateCam(dt);
  draw(dt); hud();
  requestAnimationFrame(frame);
}
function start(data) {
  S = (data && data.state) || load() || newState();
  if (S.farmer) { F.x = S.farmer.x; F.y = S.farmer.y; }
  resize();
  cam.x = F.x - cssW / cam.z / 2; cam.y = F.y - cssH / cam.z / 2; clampCam();
  setMode(S.mode || 'field', false); hud();
  ensureQuests(); renderQuests(); renderCouponChip();
  if (!PL.token && !PL.demo) openRegister(); else syncPlayer();
  if (!data || !data.state) toast(S.harvested || S.day > 1 ? 'ยินดีต้อนรับกลับสู่ฟาร์ม · วันที่ ' + S.day : 'เลือกจอบ แล้วแตะแปลงหญ้า ชาวไร่จะเดินไปไถให้');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { iconCache.clear(); renderTray(); });
  requestAnimationFrame(t0 => { prev = t0; requestAnimationFrame(frame); });
}
window.claude?.hot?.snapshot?.(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

})();
</script>
</body>
